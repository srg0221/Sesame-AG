name: Build Sesame-AG APK

on:
  # 允许在 Actions 页面手动触发构建
  workflow_dispatch:
  # 可选：推送到 main 分支时自动构建
  # push:
  #   branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'oracle'
        # 注意：Oracle JDK 在 GitHub Actions 中可能需要额外处理，
        # 如果 setup-java 的 'oracle' 发行版不可用，可改用 'temurin'，
        # 并在后续步骤中通过 sdkman 安装指定版本，或直接使用 temurin 17。
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        # 明确指定项目需要的 SDK 组件，避免自动安装最新版
        cmdline-tools-version: 'latest'
        
    - name: Install required Android SDK packages
      run: |
        sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0"
        
    - name: Grant execute permission for gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: sesame-ag-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        # 如果产物目录结构不同，请调整 path。例如某些项目在 app/build/outputs/apk/ 下。
